name: Build desktop app

# Builds the installers on every push to main and on demand.
# The first push of a new version (the "version" in package.json) also publishes the
# installers on a GitHub release named after it, e.g. v1.0.1. Later pushes of the same
# version only build.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # macOS runners: XProtect scans the freshly made disk image and keeps it busy, so
      # electron-builder's "hdiutil detach" fails. Stop it before building the .dmg files.
      - name: Free hdiutil (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          while pgrep XProtect >/dev/null; do sleep 3; done

      - name: Build installers
        shell: bash
        run: |
          npx electron-builder ${{ matrix.target }} --publish never && exit 0
          [ "$RUNNER_OS" = "macOS" ] || exit 1
          echo "Disk image was busy; trying once more"
          sudo pkill -9 XProtect >/dev/null 2>&1 || true; sleep 10
          npx electron-builder ${{ matrix.target }} --publish never
        env:
          # unsigned builds: no certificate lookup
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: virtual-debond-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version released yet?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Virtual Debond ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          generate_release_notes: true
          body: |
            **Download the file for your computer**

            - **Windows 10/11:** `Virtual-Debond-Setup-*.exe` installs the app. `Virtual-Debond-*-portable.exe` runs without installing.
            - **Mac with Apple silicon (M1 or later):** `Virtual-Debond-*-mac-arm64.dmg`
            - **Mac with Intel:** `Virtual-Debond-*-mac-x64.dmg`
            - **Linux:** `Virtual-Debond-*-linux-x86_64.AppImage` (make it executable, then run it)

            The installers are not code-signed, so the first launch needs one extra step.
            - **Windows:** SmartScreen says *Windows protected your PC*. Click **More info**, then **Run anyway**.
            - **Mac:** drag the app to Applications and try to open it once. Then go to *System Settings → Privacy & Security* and click **Open Anyway**.

            Everything runs on your computer and no scan is uploaded.
